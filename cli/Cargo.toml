[package]
name = "zkforge"
version = "1.1.7"
edition = "2021"
description = "Pure Rust ZK compiler — no circom, no snarkjs, no Node.js. Groth16 + PLONK + zkML + Recursive Proofs. EIP-197. Foundry deploy."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zkarchitect/zkforge"
readme = "../README.md"
categories = ["cryptography", "compilers", "development-tools"]
keywords = ["zero-knowledge", "groth16", "plonk", "solidity", "foundry"]

[dependencies]
zkforge-compiler = { version = "1.1.7", path = "../compiler" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4.3"
num-bigint = "0.5.1"

[[bin]]
name = "zkforge"
path = "src/main.rs"
