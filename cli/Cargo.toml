[package]
name = "zkforge"
version = "1.0.0"
edition = "2021"
description = "No-Code ZK Circuit Generator"
license = "MIT OR Apache-2.0"

[dependencies]
zkforge-compiler = { path = "../compiler" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4.3"
num-bigint = "0.5.1"

[[bin]]
name = "zkforge"
path = "src/main.rs"
