[package]
name = "zkforge-compiler"
version = "1.1.4"
edition = "2021"
description = "ZKForge compiler core — pure Rust ZK circuit synthesis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zkarchitect/zkforge"
categories = ["cryptography", "compilers"]
keywords = ["zero-knowledge", "groth16", "plonk", "zkml", "ethereum"]

[dependencies]
thiserror = "2"
num-bigint = "0.5"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ark-bn254 = "0.6"
ark-groth16 = "0.6"
ark-relations = "0.6"
rand = "0.8"
ark-ff = "0.6"
ark-ec = "0.6"
ark-poly = "0.6"
ark-serialize = "0.6"
ark-std = "0.6"
sha3 = "0.10"
k256 = { version = "0.14", features = ["ecdsa", "arithmetic"] }

[dev-dependencies]
